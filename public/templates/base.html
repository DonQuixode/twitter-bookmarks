<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}twitter-bookmarks{% endblock %}</title>
    <script src="/htmx.min.js" defer></script>
    <style>
      :root { --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --accent: #0f766e; --bg: #ffffff; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
      header { border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 16px; align-items: baseline; }
      header h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
      header h1 a { color: inherit; text-decoration: none; }
      header span { color: var(--muted); font-size: 13px; }
      .topnav { margin-left: auto; display: flex; gap: 14px; }
      .topnav a { font-size: 13px; color: var(--muted); text-decoration: none; }
      main { max-width: 860px; margin: 0 auto; padding: 20px; }
      input[type="search"], input[type="password"] { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; }
      button { font: inherit; padding: 9px 14px; border: 1px solid var(--line); background: #f9fafb; border-radius: 8px; cursor: pointer; }
      button:hover { background: #f3f4f6; }
      .row { border-bottom: 1px solid var(--line); padding: 14px 0; }
      .row p { margin: 0 0 6px; }
      .meta { color: var(--muted); font-size: 13px; }
      .meta a { color: var(--accent); text-decoration: none; }
      .empty { color: var(--muted); padding: 24px 0; }
      .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
      .error { color: #b91c1c; font-size: 14px; margin: 10px 0 0; }
      .login { max-width: 320px; margin: 40px auto; display: grid; gap: 10px; }
      .login label { font-size: 13px; color: var(--muted); }
      code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 13px; }

      /* chat */
      .chat { display: grid; grid-template-columns: 190px 1fr; gap: 24px; align-items: start; }
      .convs { display: grid; gap: 4px; font-size: 14px; position: sticky; top: 16px; }
      .convs a { color: var(--muted); text-decoration: none; padding: 6px 8px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .convs a.active { background: #f3f4f6; color: var(--fg); }
      .convs .new { color: var(--accent); font-weight: 600; }
      #messages { display: grid; gap: 14px; }
      .msg { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
      .msg.user { background: #f9fafb; }
      .msg .who { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
      .msg .who .model { text-transform: none; letter-spacing: 0; opacity: 0.65; }
      .msg .body { white-space: pre-wrap; }
      .sources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
      .sources a { font-size: 12px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
      .composer { margin-top: 16px; display: grid; gap: 8px; }
      .composer textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
      .trace { margin-top: 10px; font-size: 12px; color: var(--muted); }
      .trace summary { cursor: pointer; }
      .trace ul { margin: 6px 0 0; padding-left: 18px; }
      .htmx-indicator { display: none; }
      .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
      @media (max-width: 640px) { .chat { grid-template-columns: 1fr; } .convs { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="/chat">twitter-bookmarks</a></h1>
      <span>{% block subtitle %}your bookmarks, indexed{% endblock %}</span>
      <nav class="topnav">
        {% block nav %}
          <a href="/chat">Chat</a>
          <a href="/">Feed</a>
          <a href="/logout">Log out</a>
        {% endblock %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
